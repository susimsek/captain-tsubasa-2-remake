name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_EDITOR_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  # Pins the upstream archive identity for cache invalidation; the range path validates selected ZIP members.
  GODOT_TEMPLATES_ARCHIVE_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  GODOT_TEMPLATES_ARCHIVE_SIZE_BYTES: "1281349702"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    name: Verify and export release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0; received '$tag'." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install and verify Godot 4.7.2
        id: godot-install
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          archive="$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64.zip"
          godot_dir="$RUNNER_TEMP/godot"
          curl --fail --silent --show-error --location \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$GODOT_EDITOR_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$godot_dir"
          unzip -q "$archive" -d "$godot_dir"
          godot_bin="$godot_dir/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot_bin"
          godot_version="$("$godot_bin" --headless --version)"
          [[ "$godot_version" == "$GODOT_VERSION"* ]]
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          echo "duration_seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Start desktop template cache timer
        id: godot-template-cache-start
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Cache verified desktop export templates
        id: godot-template-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATES_ARCHIVE_SHA256 }}

      - name: Measure desktop template cache restore
        id: godot-template-cache-measure
        env:
          CACHE_HIT: ${{ steps.godot-template-cache.outputs.cache-hit }}
          CACHE_STARTED_NS: ${{ steps.godot-template-cache-start.outputs.started_ns }}
          CACHE_KEY: godot-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATES_ARCHIVE_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ended_ns="$(date +%s%N)"
          elapsed_seconds="$(awk -v start="$CACHE_STARTED_NS" -v end="$ended_ns" 'BEGIN { printf "%.3f", (end - start) / 1000000000 }')"
          cache_bytes=0
          if [[ "$CACHE_HIT" == true ]]; then
            cache_bytes="$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$CACHE_KEY" --jq '.actions_caches[0].size_in_bytes // empty' 2>/dev/null || printf 'unknown')"
            [[ "$cache_bytes" =~ ^[0-9]+$ ]] || cache_bytes=unknown
          fi
          {
            echo "duration_seconds=$elapsed_seconds"
            echo "cache_bytes=$cache_bytes"
          } >> "$GITHUB_OUTPUT"

      - name: Install and verify desktop export templates
        id: godot-template-install
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          template_files=(linux_release.x86_64 windows_release_x86_64.exe macos.zip version.txt)
          cached_templates=true
          for template in "${template_files[@]}"; do
            if [[ ! -s "$template_dir/$template" ]]; then
              cached_templates=false
            fi
          done
          if [[ "$cached_templates" != true ]]; then
            rm -rf "$template_dir"
            python3 tools/ci/download_godot_export_templates.py \
              --version "$GODOT_VERSION" \
              --expected-archive-size "$GODOT_TEMPLATES_ARCHIVE_SIZE_BYTES" \
              --output-dir "$template_dir"
            template_source=range-download
          else
            range_downloaded_bytes=0
            archive_size_bytes="$GODOT_TEMPLATES_ARCHIVE_SIZE_BYTES"
            template_source=cache
          fi
          {
            if [[ "$cached_templates" == true ]]; then
              echo "range_downloaded_bytes=$range_downloaded_bytes"
              echo "archive_size_bytes=$archive_size_bytes"
            fi
            echo "template_source=${template_source:-range-download}"
            echo "duration_seconds=$SECONDS"
          } >> "$GITHUB_OUTPUT"

      - name: Validate desktop helper syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/updater/apply_update_linux.sh
          bash -n scripts/updater/apply_update_macos.sh

      - name: Cache imported Godot resources
        id: godot-import-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot/imported
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'export_presets.cfg', '**/*.import', 'assets/**/*') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project resources
        id: import-assets
        if: steps.godot-import-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          "$GODOT_BIN" --headless --editor --path . --import
          echo "duration_seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Launch main scene briefly
        run: '"$GODOT_BIN" --headless --path . --quit-after 2'

      - name: Export Linux, Windows, and macOS desktop builds
        id: desktop-export
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          SECONDS=0
          asset_dir="$RUNNER_TEMP/release-assets"
          version="${RELEASE_TAG#v}"
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          linux_dir="$RUNNER_TEMP/linux-package"
          mkdir -p "$asset_dir"
          mkdir -p "$linux_dir"

          python3 - "$version" "$release_commit" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          commit = sys.argv[2]
          project_path = Path("project.godot")
          project_config = project_path.read_text(encoding="utf-8")
          project_config = re.sub(r'(?m)^config/version="[^"]*"$', f'config/version="{version}"', project_config)
          project_config = re.sub(r'(?m)^config/update_channel="[^"]*"$', 'config/update_channel="stable"', project_config)
          project_config = re.sub(r'(?m)^config/build_commit="[^"]*"$', f'config/build_commit="{commit}"', project_config)
          project_path.write_text(project_config, encoding="utf-8")
          path = Path("export_presets.cfg")
          config = path.read_text(encoding="utf-8")
          config = config.replace('application/short_version="0.1.0"', f'application/short_version="{version}"')
          config = config.replace('application/version="0.1.0"', f'application/version="{version}"')
          config = re.sub(r'(?m)^application/product_version="[^"]*"$', f'application/product_version="{version}"', config)
          config = re.sub(r'(?m)^application/file_version="[^"]*"$', f'application/file_version="{version}"', config)
          path.write_text(config, encoding="utf-8")
          PY

          "$GODOT_BIN" --headless --path . --export-release \
            "Linux Desktop" "$linux_dir/captain-tsubasa-2-remake.x86_64"
          cp THIRD_PARTY_NOTICES.txt "$linux_dir/THIRD_PARTY_NOTICES.txt"
          cp assets/branding/captain-tsubasa-2-icon.png "$linux_dir/captain-tsubasa-2-icon.png"
          cp packaging/linux/install-desktop-entry.sh "$linux_dir/install-desktop-entry.sh"
          cp packaging/linux/uninstall-desktop-entry.sh "$linux_dir/uninstall-desktop-entry.sh"
          chmod +x "$linux_dir/captain-tsubasa-2-remake.x86_64"
          chmod +x "$linux_dir/install-desktop-entry.sh" "$linux_dir/uninstall-desktop-entry.sh"
          linux_smoke_log="$RUNNER_TEMP/linux-export-smoke.log"
          "$linux_dir/captain-tsubasa-2-remake.x86_64" --headless --quit-after 2 >"$linux_smoke_log" 2>&1
          cat "$linux_smoke_log"
          if grep -En 'SCRIPT ERROR:|ERROR:' "$linux_smoke_log" | grep -Ev 'resources still in use at exit'; then
            echo "The exported Linux release reported a runtime error." >&2
            exit 1
          fi

          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --silent --show-error --location \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            --output "$appimagetool"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $appimagetool" | sha256sum --check -
          chmod +x "$appimagetool"
          APPIMAGETOOL="$appimagetool" packaging/linux/build-appimage.sh \
            "$linux_dir" "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-x86_64.AppImage"

          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C "$linux_dir" -cf - captain-tsubasa-2-remake.x86_64 THIRD_PARTY_NOTICES.txt \
            captain-tsubasa-2-icon.png install-desktop-entry.sh uninstall-desktop-entry.sh \
            | gzip --no-name > "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-linux-x86_64.tar.gz"

          windows_dir="$RUNNER_TEMP/windows-package"
          mkdir -p "$windows_dir"
          "$GODOT_BIN" --headless --path . --export-release \
            "Windows Desktop" "$windows_dir/captain-tsubasa-2-remake.exe"
          cp THIRD_PARTY_NOTICES.txt "$windows_dir/THIRD_PARTY_NOTICES.txt"
          (cd "$windows_dir" && zip -X -q "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-windows-x86_64.zip" \
            captain-tsubasa-2-remake.exe THIRD_PARTY_NOTICES.txt)

          macos_asset="$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-macos-universal.zip"
          "$GODOT_BIN" --headless --path . --export-release \
            "macOS Universal" "$macos_asset"
          zip -X -q -j "$macos_asset" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.txt"

          test -s "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-linux-x86_64.tar.gz"
          test -s "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-x86_64.AppImage"
          test -s "$windows_dir/captain-tsubasa-2-remake.exe"
          test -s "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-windows-x86_64.zip"
          test -s "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-macos-universal.zip"
          windows_entries="$RUNNER_TEMP/windows-package-entries.txt"
          macos_entries="$RUNNER_TEMP/macos-package-entries.txt"
          linux_entries="$RUNNER_TEMP/linux-package-entries.txt"
          unzip -tq "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-windows-x86_64.zip"
          unzip -tq "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-macos-universal.zip"
          unzip -Z1 "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-windows-x86_64.zip" > "$windows_entries"
          unzip -Z1 "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-macos-universal.zip" > "$macos_entries"
          tar -tzf "$asset_dir/captain-tsubasa-2-remake-${RELEASE_TAG}-linux-x86_64.tar.gz" > "$linux_entries"
          grep -Fxq THIRD_PARTY_NOTICES.txt "$windows_entries"
          grep -Fxq THIRD_PARTY_NOTICES.txt "$macos_entries"
          grep -Fxq THIRD_PARTY_NOTICES.txt "$linux_entries"
          grep -Fxq captain-tsubasa-2-icon.png "$linux_entries"
          grep -Fxq install-desktop-entry.sh "$linux_entries"
          grep -Fxq uninstall-desktop-entry.sh "$linux_entries"
          echo "duration_seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Upload release assets for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

      - name: Write release build performance summary
        if: always()
        env:
          ENGINE_SECONDS: ${{ steps.godot-install.outputs.duration_seconds }}
          TEMPLATE_CACHE_HIT: ${{ steps.godot-template-cache.outputs.cache-hit }}
          TEMPLATE_CACHE_SECONDS: ${{ steps.godot-template-cache-measure.outputs.duration_seconds }}
          TEMPLATE_CACHE_BYTES: ${{ steps.godot-template-cache-measure.outputs.cache_bytes }}
          TEMPLATE_SOURCE: ${{ steps.godot-template-install.outputs.template_source }}
          TEMPLATE_SECONDS: ${{ steps.godot-template-install.outputs.duration_seconds }}
          TEMPLATE_RANGE_BYTES: ${{ steps.godot-template-install.outputs.range_downloaded_bytes }}
          TEMPLATE_ARCHIVE_BYTES: ${{ steps.godot-template-install.outputs.archive_size_bytes }}
          IMPORT_CACHE_HIT: ${{ steps.godot-import-cache.outputs.cache-hit }}
          IMPORT_SECONDS: ${{ steps.import-assets.outputs.duration_seconds }}
          EXPORT_SECONDS: ${{ steps.desktop-export.outputs.duration_seconds }}
        shell: bash
        run: |
          value() { [[ -n "$1" ]] && printf '%ss' "$1" || printf 'not reached'; }
          if [[ "${IMPORT_CACHE_HIT:-}" == true ]]; then
            import_state="exact cache hit; redundant import skipped"
            import_duration="—"
          else
            import_state="cache miss; imported"
            import_duration="$(value "${IMPORT_SECONDS:-}")"
          fi
          template_transfer="not reached"
          if [[ "$TEMPLATE_CACHE_HIT" == true ]]; then
            if [[ "$TEMPLATE_CACHE_BYTES" =~ ^[0-9]+$ ]]; then
              template_transfer="$(numfmt --to=iec-i --suffix=B "$TEMPLATE_CACHE_BYTES") restored from cache"
            else
              template_transfer="cache archive size unavailable"
            fi
          elif [[ "$TEMPLATE_RANGE_BYTES" =~ ^[0-9]+$ && "$TEMPLATE_ARCHIVE_BYTES" =~ ^[0-9]+$ ]]; then
            template_transfer="$(numfmt --to=iec-i --suffix=B "$TEMPLATE_RANGE_BYTES") ranged / $(numfmt --to=iec-i --suffix=B "$TEMPLATE_ARCHIVE_BYTES") full archive"
            if [[ "$TEMPLATE_ARCHIVE_BYTES" -gt 0 ]]; then
              saved_percent="$(awk -v transferred="$TEMPLATE_RANGE_BYTES" -v full="$TEMPLATE_ARCHIVE_BYTES" 'BEGIN { printf "%.1f%% less network data", (1 - transferred / full) * 100 }')"
              template_transfer="$template_transfer ($saved_percent)"
            fi
          fi
          template_duration="cache restore $(value "$TEMPLATE_CACHE_SECONDS"); template setup $(value "$TEMPLATE_SECONDS")"
          {
            echo "## Release build performance"
            echo
            echo "Measured stages for the tagged desktop release build. The cold template path fetches only required archive ranges; cache entries are keyed by the pinned engine/template archive identities and the project's import inputs."
            echo
            echo "| Stage | Cache | Duration | Network transfer |"
            echo "| --- | --- | ---: | ---: |"
            echo "| Godot 4.7.2 install (SHA-256 verified) | — | $(value "${ENGINE_SECONDS:-}") | — |"
            echo "| Godot 4.7.2 desktop templates | exact hit: ${TEMPLATE_CACHE_HIT:-unknown}; source: ${TEMPLATE_SOURCE:-unknown} | $template_duration | $template_transfer |"
            echo "| Imported Godot resources | ${import_state} | ${import_duration} | — |"
            echo "| Linux, Windows, and macOS exports and packaging | — | $(value "${EXPORT_SECONDS:-}") | — |"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-installer:
    name: Build per-user Windows installer
    needs: source-release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.source-release.outputs.release_tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the portable Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Prepare installer inputs
        shell: pwsh
        run: |
          $releaseAssets = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'windows-package'
          $installerDirectory = Join-Path $env:RUNNER_TEMP 'windows-installer'
          New-Item -ItemType Directory -Path $packageDirectory, $installerDirectory -Force | Out-Null
          $archive = Get-ChildItem -LiteralPath $releaseAssets -Filter '*-windows-x86_64.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'The portable Windows release package is missing.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageDirectory -Force
          "WINDOWS_PACKAGE_DIR=$packageDirectory" >> $env:GITHUB_ENV
          "WINDOWS_INSTALLER_DIR=$installerDirectory" >> $env:GITHUB_ENV
          "APP_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $download
          $actualHash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b') {
            throw "Inno Setup checksum mismatch: $actualHash"
          }
          $process = Start-Process -FilePath $download -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          $compilerPaths = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $compilerPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($null -eq $iscc) { throw 'The Inno Setup compiler was not installed.' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile Windows setup package
        shell: pwsh
        run: |
          $icon = Join-Path $env:GITHUB_WORKSPACE 'assets/branding/captain-tsubasa-2.ico'
          $script = Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/windows_installer.iss'
          & $env:ISCC "/DAppVersion=$env:APP_VERSION" "/DReleaseTag=$env:RELEASE_TAG" "/DSourceDir=$env:WINDOWS_PACKAGE_DIR" "/DIconFile=$icon" "/DOutputDir=$env:WINDOWS_INSTALLER_DIR" $script
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = Join-Path $env:WINDOWS_INSTALLER_DIR "captain-tsubasa-2-remake-$env:RELEASE_TAG-windows-x86_64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'The Windows setup package was not produced.' }

      - name: Upload Windows setup package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: ${{ runner.temp }}/windows-installer/*.exe
          if-no-files-found: error

  publish-release:
    name: Sign and publish desktop release
    needs: [source-release, windows-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      release_tag: ${{ needs.source-release.outputs.release_tag }}
    env:
      RELEASE_TAG: ${{ needs.source-release.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Download Windows setup package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup
          path: ${{ runner.temp }}/release-assets

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          chmod +x "$asset_dir"/*.AppImage
          (
            cd "$asset_dir"
            sha256sum -- * > SHA256SUMS
          )

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v2.6.1

      - name: Sign and verify checksum manifest with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          cosign sign-blob "$asset_dir/SHA256SUMS" \
            --bundle "$asset_dir/SHA256SUMS.sigstore.json" \
            --yes
          cosign verify-blob "$asset_dir/SHA256SUMS" \
            --bundle "$asset_dir/SHA256SUMS.sigstore.json" \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(heads/.+|tags/v.+)$" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          {
            echo "### Release signatures"
            echo "- Sigstore: verified for ${RELEASE_TAG}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Optionally sign checksum manifest with GPG
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY || '' }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          if [[ -z "$RELEASE_GPG_PRIVATE_KEY" ]]; then
            echo "No RELEASE_GPG_PRIVATE_KEY configured; skipping the optional GPG signature."
            echo "- GPG detached signature: not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          key_file="$RUNNER_TEMP/release-signing-key.asc"
          import_log="$RUNNER_TEMP/release-signing-import.log"
          passphrase_file="$RUNNER_TEMP/release-signing-passphrase"
          trap 'rm -f "$key_file" "$import_log" "$passphrase_file"' EXIT
          umask 077
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > "$key_file"
          if ! gpg --batch --import "$key_file" > "$import_log" 2>&1; then
            echo "Release GPG signing key import failed." >&2
            exit 1
          fi
          rm -f "$key_file" "$import_log"

          gpg_args=(--batch --yes --armor --detach-sign)
          if [[ -n "$RELEASE_GPG_PASSPHRASE" ]]; then
            printf '%s' "$RELEASE_GPG_PASSPHRASE" > "$passphrase_file"
            gpg_args+=(--pinentry-mode loopback --passphrase-file "$passphrase_file")
          fi
          if ! gpg "${gpg_args[@]}" \
            --output "$asset_dir/SHA256SUMS.asc" \
            "$asset_dir/SHA256SUMS" > "$import_log" 2>&1; then
            echo "Release checksum GPG signing failed." >&2
            exit 1
          fi
          echo "- GPG detached signature: created." >> "$GITHUB_STEP_SUMMARY"

      - name: Recreate the tagged release with all packages
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          shopt -s nullglob
          assets=("$asset_dir"/*)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --repo "$GH_REPO"
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --repo "$GH_REPO"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body --jq '.body' > "$notes_file"
          cat >> "$notes_file" <<'EOF'

          ## Downloads

          | Platform | File | First launch |
          | --- | --- | --- |
          | Windows | `captain-tsubasa-2-remake-RELEASE_TAG-windows-x86_64-setup.exe` (installer), or portable `captain-tsubasa-2-remake-RELEASE_TAG-windows-x86_64.zip` | Setup: run the installer. ZIP: extract and run `captain-tsubasa-2-remake.exe`. The build is unsigned, so SmartScreen may warn: *More info → Run anyway*. |
          | Linux | `captain-tsubasa-2-remake-RELEASE_TAG-x86_64.AppImage`, or `captain-tsubasa-2-remake-RELEASE_TAG-linux-x86_64.tar.gz` | `chmod +x captain-tsubasa-2-remake-RELEASE_TAG-x86_64.AppImage && ./captain-tsubasa-2-remake-RELEASE_TAG-x86_64.AppImage`, or use the tarball. |
          | macOS | `captain-tsubasa-2-remake-RELEASE_TAG-macos-universal.zip` → `Captain Tsubasa 2 Remake.app` | The app is ad-hoc signed, not notarised: right-click `Captain Tsubasa 2 Remake.app` → *Open*, or run `xattr -dr com.apple.quarantine "Captain Tsubasa 2 Remake.app"`. |

          Verify downloads against `SHA256SUMS` in the release.
          EOF
          sed -i "s/RELEASE_TAG/$RELEASE_TAG/g" "$notes_file"
          gh release edit "$RELEASE_TAG" --notes-file "$notes_file" --repo "$GH_REPO"

  linux-release-smoke:
    name: Launch published Linux package
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and launch the Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/linux-release"
          mkdir -p "$package_dir"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern "*linux-x86_64.tar.gz" --dir "$package_dir"
          archive=$(find "$package_dir" -maxdepth 1 -name '*linux-x86_64.tar.gz' -print -quit)
          tar -xzf "$archive" -C "$package_dir"
          executable="$package_dir/captain-tsubasa-2-remake.x86_64"
          chmod +x "$executable"
          smoke_log="$RUNNER_TEMP/linux-release-smoke.log"
          "$executable" --headless --quit-after 2 >"$smoke_log" 2>&1
          cat "$smoke_log"
          if grep -En 'SCRIPT ERROR:|ERROR:' "$smoke_log" | grep -Ev 'resources still in use at exit'; then
            echo "The published Linux release reported a runtime error." >&2
            exit 1
          fi

  windows-release-smoke:
    name: Launch published Windows package
    needs: publish-release
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish-release.outputs.release_tag }}
      - name: Download and launch the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish-release.outputs.release_tag }}
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $installerPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/updater/apply_update_windows.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($installerPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'The Windows update installer could not be parsed.'
          }
          $packageDirectory = Join-Path $env:RUNNER_TEMP 'windows-release'
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GH_REPO `
            --pattern '*windows-x86_64.zip' --dir $packageDirectory
          $archive = Get-ChildItem -LiteralPath $packageDirectory -Filter '*windows-x86_64.zip' | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageDirectory -Force
          $executable = Join-Path $packageDirectory 'captain-tsubasa-2-remake.exe'
          $smokeLog = Join-Path $env:RUNNER_TEMP 'windows-release-smoke.log'
          & $executable --headless --quit-after 2 2>&1 | Tee-Object -FilePath $smokeLog
          if ($LASTEXITCODE -ne 0) {
            throw "The published Windows release exited with code $LASTEXITCODE."
          }
          $runtimeErrors = Select-String -Path $smokeLog -Pattern 'SCRIPT ERROR:|ERROR:' -CaseSensitive |
            Where-Object { $_.Line -notmatch 'resources still in use at exit' }
          if ($runtimeErrors) {
            throw 'The published Windows release reported a runtime error.'
          }

  macos-release-smoke:
    name: Launch published macOS package
    needs: publish-release
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download and launch the macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/macos-release"
          mkdir -p "$package_dir"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern "*macos-universal.zip" --dir "$package_dir"
          archive=$(find "$package_dir" -maxdepth 1 -name '*macos-universal.zip' -print -quit)
          /usr/bin/ditto -x -k "$archive" "$package_dir"
          app=$(find "$package_dir" -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          smoke_log="$RUNNER_TEMP/macos-release-smoke.log"
          "$app/Contents/MacOS/$executable" --headless --quit-after 2 >"$smoke_log" 2>&1
          cat "$smoke_log"
          if grep -En 'SCRIPT ERROR:|ERROR:' "$smoke_log" | grep -Ev 'resources still in use at exit'; then
            echo "The published macOS release reported a runtime error." >&2
            exit 1
          fi
